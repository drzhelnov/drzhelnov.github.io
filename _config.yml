theme: jekyll-theme-minimal
timezone: Etc/GMT+12
defaults:
  -
    scope:
      path: "" # an empty string here means all files in the project
    values:
      layout: "default"
      sitemap: false
  - scope:
      path: "README.md"
    values:
      sitemap: true
  - scope:
      path: "ai"
    values:
      sitemap: true
  - scope:
      path: "ai/chats"
    values:
      sitemap: false
  - scope:
      path: "b"
    values:
      sitemap: true
  - scope:
      path: "usmle"
    values:
      sitemap: true
  - scope:
      path: "usmle/**/*.pdf"
    values:
      sitemap: false
  - scope:
      path: "usmle/usmle.org"
    values:
      sitemap: false
title: "Pavel Zhelnov"
url: "https://pavel.zheln.com"
description: "Hi, I’m Pavel, a surgeon-turned-research engineer. I help people who need reproducible scientific data and AI but lack the technical expertise. I’ve worked for 10 years in medicine and health administration and shipped software since 2012."
lang: "en-US"
show_downloads: true
google_analytics: G-TX0TDKGNHK
ya_metrika: 70928308
markdown: kramdown
plugins:
  - jekyll-readme-index
  - jekyll-seo-tag
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
  - jekyll-sitemap
readme_index:
  enabled:          true
  remove_originals: false
  with_frontmatter: false
optional_front_matter:
  remove_originals: false
titles_from_headings:
  enabled:     true
  strip_title: false
  collections: false
