<!doctype html>
{% assign target = page.redirect | absolute_url %}
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <meta http-equiv="refresh" content="0; url={{ target | escape }}"/>
        <link rel="canonical" href="{{ target | escape }}"/>
        <script type="text/javascript">
                const target = {{ target | jsonify }};
                window.location.replace(target + window.location.hash);
        </script>
        <title>Page Redirection</title>
    </head>
    <body>
        If you are not redirected automatically, follow <a href='{{ target | escape }}'>this link</a>.
    </body>
</html>
